# Walkitecture backend + PostgreSQL.
#   docker compose up --build        -> API on http://localhost:8000 (docs at /docs)
# Optional: put JWT_SECRET=... and OPENAI_API_KEY=... in a top-level .env file (never commit it).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-walkitecture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walkitecture}
      POSTGRES_DB: ${POSTGRES_DB:-walkitecture}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-walkitecture}:${POSTGRES_PASSWORD:-walkitecture}@db:5432/${POSTGRES_DB:-walkitecture}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Set JWT_SECRET (e.g. `openssl rand -hex 32`) in a top-level .env; without it tokens reset on restart.
      JWT_SECRET: ${JWT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  pgdata:
