# Walkitecture app (FastAPI API + built SPA in one image) + PostgreSQL.
#   docker compose up --build        -> app on http://localhost:8000 (API docs at /docs)
#   frontend dev with hot reload:    cd frontend && npm run dev   -> http://localhost:5173
# Optional: put JWT_SECRET=... and OPENAI_API_KEY=... in a top-level .env file (never commit it).
# Production (VPS behind Traefik): add -f docker-compose.prod.yml, see ARCHITECTURE.md §9.
name: walkitecture
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-walkitecture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-walkitecture}
      POSTGRES_DB: ${POSTGRES_DB:-walkitecture}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: walkitecture-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-walkitecture}:${POSTGRES_PASSWORD:-walkitecture}@db:5432/${POSTGRES_DB:-walkitecture}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Set JWT_SECRET (e.g. `openssl rand -hex 32`) in a top-level .env; without it tokens reset on restart.
      JWT_SECRET: ${JWT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SEED_SAMPLE_PLANS: ${SEED_SAMPLE_PLANS:-true}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      # Dev login seeded on every start (idempotent). Set SEED_USERNAME= (empty) to disable.
      SEED_USERNAME: ${SEED_USERNAME-demo}
      SEED_PASSWORD: ${SEED_PASSWORD-walkitecture-demo}
      SEED_EXAMPLES_DIR: /examples
    volumes:
      - ./examples:/examples:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  pgdata:
